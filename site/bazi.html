<!doctype html>
<html lang="zh-CN" data-api-base="https://lingji-analysis-api.827793958.workers.dev">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>八字命盘 · 灵机阁</title>
  <link rel="stylesheet" href="tool.css"><link rel="stylesheet" href="tool-fix.css">
</head>
<body>
  <audio id="background-music" src="assets/bg.mp3" loop autoplay preload="auto"></audio>
  <div class="tool-shell">
    <nav class="tool-nav"><a class="tool-brand" href="index.html"><span>✦</span> 灵机阁</a><div class="tool-nav-actions"><button class="music-toggle" type="button" aria-pressed="false" aria-label="播放背景音乐" title="播放背景音乐">♫</button><a href="index.html">← 返回首页</a></div></nav>
    <header class="tool-hero"><div class="kicker">Four Pillars of Destiny</div><h1>八字命盘</h1><p>以出生年、月、日、时构成四柱，观察你的天赋、人生节奏与关键课题。</p></header>
    <div class="progress"><span class="is-active"><b>1</b>填写信息</span><span><b>2</b>生成命盘</span><span><b>3</b>查看解读</span></div>
    <main class="tool-main">
      <form class="form-card tool-form">
        <h2>出生信息</h2><p>出生信息仅用于本次排盘和解读，不在浏览器中保存。</p>
        <div class="fields">
          <div class="field"><label for="name">姓名</label><input id="name" placeholder="如何称呼你"></div>
          <div class="field"><label for="gender">性别</label><select id="gender" required><option value="">请选择</option><option value="male">男</option><option value="female">女</option></select></div>
          <div class="field"><label for="birth-date-time">出生日期与时间</label><input id="birth-date-time" required type="datetime-local"></div>
          <div class="field"><label for="birth-place">出生地点</label><input id="birth-place" placeholder="例如：上海市（当前排盘统一按北京时间）"></div>
          <div class="field"><label for="focus">当前关注</label><select id="focus"><option>综合人生指引</option><option>事业与财富</option><option>情感与关系</option><option>年度运势</option></select></div>
          <div class="field"><label for="occupation">职业（可选）</label><input id="occupation" placeholder="例如：设计师"></div>
          <div class="field wide"><label for="question">想问的问题（可选）</label><textarea id="question" placeholder="写下你最想获得启发的事情……"></textarea></div>
        </div>
        <button class="submit" type="submit">生成我的八字解读 →</button>
        <p class="form-status" role="status" aria-live="polite"></p>
        <section class="result" aria-live="polite"><h3>你的八字解读</h3><p class="result-meta"></p><div class="result-grid chart-grid"></div><div class="interpretation"></div><p class="result-sources"></p></section>
      </form>
      <div class="safe"><span>✦ Worker 服务端处理</span><span>✦ 传统框架辅助理解</span><span>✦ 不构成专业建议</span></div>
    </main>
  </div>
  <script src="format-ai-response.js"></script><script src="turnstile.js"></script><script src="tool.js"></script><script src="music.js"></script>
</body>
</html>
