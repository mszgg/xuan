<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>择日与占梦 · 灵机阁</title>
    <link rel="stylesheet" href="tool.css" />
    <link rel="stylesheet" href="tool-fix.css" />
  </head>
  <body>
    <div class="tool-shell">
      <nav class="tool-nav">
        <a class="tool-brand" href="index.html"><span>✦</span> 灵机阁</a
        ><a href="index.html">← 返回首页</a>
      </nav>
      <header class="tool-hero">
        <div class="kicker">Auspicious Day Selection</div>
        <h1>择日</h1>
        <p>为生活中的重要时刻整理日期范围、个人偏好与时间安排。</p>
      </header>
      <div class="progress">
        <span><b>1</b>填写事件</span><span><b>2</b>筛选日期</span
        ><span><b>3</b>查看建议</span>
      </div>
      <main class="tool-main">
        <form class="form-card tool-form">
          <h2>事件信息</h2>
          <p>静态版本将模拟推荐日期卡片的呈现，不包含真实历法计算。</p>
          <div class="fields">
            <div class="field">
              <label>事件类型</label
              ><select required>
                <option value="">请选择</option>
                <option>婚礼 / 订婚</option>
                <option>搬家 / 入宅</option>
                <option>开业 / 签约</option>
                <option>旅行 / 重要会面</option>
                <option>考试 / 面试</option>
              </select>
            </div>
            <div class="field">
              <label>事件地点</label
              ><input required placeholder="例如：广州市" />
            </div>
            <div class="field">
              <label>开始日期</label><input required type="date" />
            </div>
            <div class="field">
              <label>结束日期</label><input required type="date" />
            </div>
            <div class="field">
              <label>姓名（可选）</label><input placeholder="用于个性化展示" />
            </div>
            <div class="field">
              <label>出生日期（可选）</label><input type="date" />
            </div>
            <div class="field wide">
              <label>偏好或需避开的日期（可选）</label
              ><textarea
                placeholder="例如：避开周一；优先考虑周末……"
              ></textarea>
            </div>
          </div>
          <button class="submit" type="submit">寻找合适日期 →</button>
          <section class="result">
            <h3>日期建议已准备好</h3>
            <p>
              这是静态演示结果。接入历法与个人信息分析后，这里将展示推荐日期、时段与避开日期。
            </p>
            <div class="result-grid">
              <div><b>优先日期</b>综合条件筛选</div>
              <div><b>适宜时段</b>便于安排行程</div>
              <div><b>避开提示</b>保留个人偏好</div>
            </div>
          </section>
        </form>
        <div class="safe">
          <span>✦ 事件导向</span><span>✦ 日期范围筛选</span
          ><span>✦ 静态演示版本</span>
        </div>
      </main>
    </div>
    <script src="tool.js"></script>
  </body>
</html>
