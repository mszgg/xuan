# Static website Worker. The API remains deployed with wrangler.toml.
name = "young-bonus-6df5"
main = "src/static-site.ts"
compatibility_date = "2026-09-16"

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true

# 在 Cloudflare Dashboard 的此 Worker「Variables」中设置同名变量或 Secret。
# Turnstile Site Key 会注入页面，是公开值；不要把 Secret Key 写在这里。
# TURNSTILE_SITE_KEY = "0x..."
